```yaml
name: Build BlueShare APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --project-name blueshare .

      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Set compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          k = Path("android/app/build.gradle.kts")
          g = Path("android/app/build.gradle")

          if k.exists():
              p = k
              pattern = r'(?m)^\s*compileSdk\s*=.*$'
              replacement = '    compileSdk = 36'
          elif g.exists():
              p = g
              pattern = r'(?m)^\s*compileSdk(?:Version)?\s+.*$'
              replacement = '    compileSdkVersion 36'
          else:
              raise SystemExit("Gradle file not found")

          s = p.read_text()
          s, n = re.subn(pattern, replacement, s, count=1)
          if n == 0:
              raise SystemExit("compileSdk setting not found")
          p.write_text(s)
          print("compileSdk set to 36")
          PY

      - name: Add offline permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />',
          ]

          for item in permissions:
              name = item.split('android:name="')[1].split('"')[0]
              if f'android:name="{name}"' not in s:
                  s = s.replace('<application', item + '\n    <application', 1)

          p.write_text(s)
          print("Permissions added")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueShare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
