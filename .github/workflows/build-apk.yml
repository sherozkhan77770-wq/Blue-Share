
name: Build BlueShare APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name blueshare .

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 20
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36"

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kotlin = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kotlin.exists():
              path = kotlin
              pattern = r'(?m)^\s*compileSdk\s*=.*$'
              replacement = '    compileSdk = 36'
          elif groovy.exists():
              path = groovy
              pattern = r'(?m)^\s*compileSdk(?:Version)?\s+.*$'
              replacement = '    compileSdkVersion 36'
          else:
              raise SystemExit("Android app Gradle file not found")

          content = path.read_text()
          content, count = re.subn(pattern, replacement, content, count=1)

          if count == 0:
              raise SystemExit("Could not find compileSdk setting")

          path.write_text(content)
          print("Android compileSdk set to 36")
          PY

      - name: Add offline connection permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="28" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />',
          ]

          for permission in permissions:
              name = permission.split('android:name="')[1].split('"')[0]
              if f'android:name="{name}"' not in content:
                  content = content.replace(
                      '<application',
                      '    ' + permission + '\n    <application',
                      1
                  )

          path.write_text(content)
          print("Offline connection permissions added to AndroidManifest.xml")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueShare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
