
name: Build BlueShare APK

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --project-name blueshare .

      - name: Set compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.CHANGE_WIFI_STATE',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_ADMIN',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.BLUETOOTH_SCAN',
              'android.permission.BLUETOOTH_ADVERTISE',
              'android.permission.BLUETOOTH_CONNECT',
              'android.permission.NEARBY_WIFI_DEVICES',
          ]

          lines = []
          for name in permissions:
              if f'android:name="{name}"' not in s:
                  lines.append(
                      f'    <uses-permission android:name="{name}" />'
                  )

          if lines:
              s = s.replace(
                  '<application',
                  '\n'.join(lines) + '\n    <application',
                  1
              )
              p.write_text(s)

          print("Android permissions configured")
          PY

      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueShare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
